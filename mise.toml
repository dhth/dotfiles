min_version = "2026.10.0"
monorepo_root = true

[monorepo]
config_roots = ["nvim"]
lockfile = true

[settings]
exec_auto_install = false
task.run_auto_install = false

[tools]
actionlint = "latest"
shfmt = "latest"
cljfmt = "latest"
yamlfmt = "latest"

[tool_alias]
cljfmt = "github:weavejester/cljfmt"

[tasks."fmt"]
alias = "f"
description = "Format files"
run = [
    { tasks = ["fmt:sh", "fmt:edn", "//nvim:fmt"] },
]

[tasks."fmt:check"]
alias = "fc"
description = "Check file formatting without changing files"
run = [
    { tasks = ["fmt:check:sh", "fmt:check:edn", "//nvim:fmt:check"] },
]

[tasks."fmt:sh"]
description = "Format sh files"
run = "shfmt -i 4 -w $(git ls-files '*.sh') utils/exe"

[tasks."fmt:check:sh"]
description = "Check sh formatting without changing files"
run = "shfmt -i 4 -d $(git ls-files '*.sh') utils/exe"

[tasks."fmt:edn"]
description = "Format karabiner.edn"
run = '''
cljfmt fix karabiner/karabiner.edn
'''

[tasks."fmt:check:edn"]
description = "Check karabiner.edn formatting without changing files"
run = "cljfmt check karabiner/karabiner.edn"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."lint:yaml"]
description = "Lint YAML files"
run = '''
# These tmuxinator templates contain Ruby ERB control blocks, not plain YAML.
yamlfmt \
    -lint \
    -quiet \
    -formatter 'retain_line_breaks_single=true' \
    -exclude tmuxinator/scala-proj.yml \
    -exclude tmuxinator/two-windows.yml \
    $(git ls-files '*.yml' '*.yaml')
'''

[tasks."global-tools:install"]
alias = "i"
description = "Install global tools from the committed lockfile"
run = 'mise -C "$HOME" install --locked'

[tasks."global-tools:lock"]
alias = "l"
description = "Update the global lockfile without bumping existing versions"
run = "mise lock --global"

[tasks."global-tools:bump-lock"]
alias = "bl"
description = "Bump fuzzy global tool versions in the lockfile"
run = "mise lock --global --bump"

[tasks."global-tools:bump-agents"]
alias = "ba"
description = "Bump versions for agents in the lockfile"
run = "mise lock --global --bump amp claude codex opencode openchamber pi"

[tasks."global-tools:bump-agents-no-delay"]
alias = "band"
description = "Bump agents without any release-age delay"
run = "mise lock --global --bump --minimum-release-age 0s amp claude codex opencode openchamber pi"

[tasks."karabiner:update-environment"]
description = "Update Karabiner's environment for required tools"
run = '''
environment_file='/Library/Application Support/org.pqrs/config/karabiner_environment'

sudo mkdir -p "$(dirname "$environment_file")"
printf 'PATH=$HOME/.local/bin/utils:$PATH\n' |
  sudo tee "$environment_file" > /dev/null

printf 'Karabiner environment updated. Restart Karabiner-Elements to apply it.\n'
printf '\n---\n'
cat "$environment_file"
printf '%s\n' '---'
'''
