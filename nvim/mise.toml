[tools]
lua-language-server = "latest"
stylua = "latest"
tree-sitter = "latest"

[tasks.fmt]
alias = "f"
description = "Format Lua files"
run = "stylua init.lua lua ftplugin"

[tasks."fmt:check"]
description = "Check Lua formatting without changing files"
run = "stylua --check init.lua lua ftplugin"
