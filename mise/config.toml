min_version = "2026.10.0"

[settings]
exec_auto_install = false
task.run_auto_install = false

[shell_alias]
":q" = "exit"
":qa" = "exit"
".." = "cd .."
a = "atls"
b = "btop"
calrefresh = "bash $DOT_FILES_DIR/utils/calendar_refresh.sh"
cdr = "cd $(git rev-parse --show-toplevel)"
cl = "clear"
clar = "clear"
cpl = "copilot"
crt = "crumbs tui"
cts = "commits"
d = 'just --justfile "$PROJECTS_DIR/dotfiles/just/docker" --choose'
dev = "assume ai-dev && unset AWS_PROFILE"
dps = "docker ps"
e = "exit"
g = "git"
gcb = "git checkout -b"
gcd1 = "git clone --depth=1"
gf = "git fetch"
ghs = "gh auth switch"
gp = "git pull"
gs = "git status -sb"
icloud = "cd $ICLOUD_DIR"
jp = "cd $PROJECTS_DIR"
k = "kubectl"
lc = "fc -ln -1 | pbcopy"
lg = "lazygit"
ls = "ls -aG"
luamake = "/Users/dht93/Soft/lua-language-server/3rd/luamake/luamake"
lzd = "lazydocker"
m = "mise run"
mds = "mdserve -p 6899"
oc = "opencode"
ommc = "omm --db-path=.local/omm.db"
ommw = "omm --config-path=~/.config/omm/omm-w.toml"
po = "punchout"
prod = "assume ai-prod && unset AWS_PROFILE"
sk = "skepsis"
sprint = "jira sprint list --current -a $(jira me)"
t = "ting p $?"
ta = "tmux attach"
ticks = 'jira sprint list --current -q "sprint in openSprints() AND assignee = currentUser()"'
tx = "tmuxinator"
v = "nvim"
vv = 'nvim --cmd "let g:lsp=v:true"'
wl = 'hours -d "~/.local/share/hours/work.db" -t gruvbox-dark'
wx = "workmux"

[tools]
actionlint = "latest"
amp = { version = "latest", allow_builds = ["@ampcode/cli"] }
asciinema = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
bat = "latest"
claude = "latest"
codex = "latest"
delta = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
gopls = { version = "latest", depends = "go" }
granted = "0.38.0"
hunk = "latest"
hyperfine = "latest"
jira = "latest"
jq = "latest"
just = "latest"
k9s = "latest"
kubectl = "latest"
lazydocker = "0.25.2"
lazygit = "latest"
mdserve = "latest"
neovim = "latest"
node = "lts"
opencode = "latest"
pi = "latest"
ripgrep = "latest"
ruby = "4.0.6"
shellcheck = "latest"
shfmt = "latest"
terminal-control-darwin = { version = "1.2.1", os = ["macos/arm64"] }
terminal-control-linux = { version = "1.2.1-r1", version_prefix = "musl-v", os = ["linux/x64"] }
tmux = "3.6b"
tmuxinator = { version = "3.4.1", depends = "ruby" }
tuicr = "v0.24.0"
turbolift = "latest"
uv = "latest"
workmux = "latest"
yamlfmt = "latest"
zls = "0.16.0"

[tools.goku]
version = "0.8.0"
os = ["macos/arm64"]
strip_components = 1
bin_path = "bin"
postinstall = '''
mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" &&
ln -sf ../goku "$MISE_TOOL_INSTALL_PATH/bin/goku"
'''

[tools.goku.platforms]
macos-arm64 = { url = "https://github.com/yqrashawn/GokuRakuJoudo/releases/download/v{{ version }}/goku-arm.zip", checksum = "sha256:c912f151f01067eac4effe36c278e5b3a5274febdbfdbe58de5556ba36461008" }

[tool_alias]
asciinema = "github:asciinema/asciinema"
goku = "http:goku"
gopls = "go:golang.org/x/tools/gopls"
jira = "github:ankitpokhrel/jira-cli"
mdserve = "github:jfernandez/mdserve"
terminal-control-darwin = "npm:@kitlangton/terminal-control-darwin-arm64"
terminal-control-linux = "github:dhth/terminal-control"
tmuxinator = "gem:tmuxinator"
tuicr = "github:agavra/tuicr"
turbolift = "github:Skyscanner/turbolift"
