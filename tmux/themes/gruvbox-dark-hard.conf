## Gruvbox Dark Hard

set-environment -g FZF_DEFAULT_OPTS "--color=dark,bg:#1d2021,bg+:#504945,fg:#ebdbb2,fg+:#ebdbb2,hl:#fabd2f,hl+:#fe8019,info:#83a598,prompt:#fe8019,pointer:#fb4934,marker:#8ec07c,spinner:#83a598,header:#928374,border:#504945 --bind=ctrl-a:select-all"

set -g status on
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-justify left
set -g status-left-style none
set -g status-left-length 80
set -g status-right-style none
set -g status-right-length 80

setw -g window-status-separator ""
setw -g window-status-style "bg=#282828,fg=#3c3836"
setw -g window-status-activity-style "bg=#282828,fg=#a89984"
setw -g window-status-current-style "bg=#fb4934,fg=#3c3836"
setw -g window-status-bell-style "bg=#fb4934,fg=#1d2021"

set -g pane-active-border-style "fg=#282828"
set -g pane-border-style "fg=#282828"
set -g popup-border-style "fg=#504945"

set -g message-style "bg=#504945,fg=#ebdbb2"
set -g message-command-style "bg=#504945,fg=#ebdbb2"
set -g display-panes-active-colour "#d5c4a1"
set -g display-panes-colour "#3c3836"
setw -g clock-mode-colour "#83a598"

set -g status-left "#[fg=#1d2021,bg=#fe8019] #S "
set -g status-right "#[fg=#1d2021,bg=#a89984,nobold,nounderscore,noitalics] #(~/tmux_battery.sh)  %a, %b %d  %H:%M #[fg=#1d2021,bg=#a89984,nobold,nounderscore,noitalics]"

setw -g window-status-format "#[fg=#928374,bg=#1d2021] #I #[fg=#928374,bg=#1d2021]#W "
setw -g window-status-current-format "#[fg=#1d2021,bg=#928374,nobold,nounderscore,noitalics]#[fg=#1d2021,bg=#928374] #I #[fg=#1d2021,bg=#928374]#W #[fg=#1d2021,bg=#928374,nobold,nounderscore,noitalics]"
