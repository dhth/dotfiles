## Gruvbox Light Hard

set-environment -g FZF_DEFAULT_OPTS "--color=light,bg:#f9f5d7,bg+:#d5c4a1,fg:#3c3836,fg+:#3c3836,hl:#b57614,hl+:#af3a03,info:#076678,prompt:#af3a03,pointer:#9d0006,marker:#427b58,spinner:#076678,header:#928374,border:#d5c4a1 --bind=ctrl-a:select-all"
set-environment -g LG_CONFIG_FILE "$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/themes/gruvbox-light-hard.yml"

set -g status-style "bg=#f9f5d7,fg=#3c3836"

setw -g window-status-style "bg=#fbf1c7,fg=#ebdbb2"
setw -g window-status-activity-style "bg=#fbf1c7,fg=#7c6f64"
setw -g window-status-current-style "bg=#9d0006,fg=#ebdbb2"
setw -g window-status-bell-style "bg=#9d0006,fg=#f9f5d7"

set -g pane-active-border-style "fg=#fbf1c7"
set -g pane-border-style "fg=#fbf1c7"
set -g popup-border-style "fg=#d5c4a1"

set -g message-style "bg=#d5c4a1,fg=#3c3836"
set -g message-command-style "bg=#d5c4a1,fg=#3c3836"
set -g display-panes-active-colour "#504945"
set -g display-panes-colour "#ebdbb2"
setw -g clock-mode-colour "#076678"

set -g status-left "#[fg=#f9f5d7,bg=#af3a03] #S "
set -g status-right "#[fg=#f9f5d7,bg=#7c6f64,nobold,nounderscore,noitalics] #(~/tmux_battery.sh)  %a, %b %d  %H:%M #[fg=#f9f5d7,bg=#7c6f64,nobold,nounderscore,noitalics]"

setw -g window-status-format "#[fg=#928374,bg=#f9f5d7] #I #[fg=#928374,bg=#f9f5d7]#W "
setw -g window-status-current-format "#[fg=#f9f5d7,bg=#928374,nobold,nounderscore,noitalics]#[fg=#f9f5d7,bg=#928374] #I #[fg=#f9f5d7,bg=#928374]#W #[fg=#f9f5d7,bg=#928374,nobold,nounderscore,noitalics]"
