## Gruvbox Light Hard

set-environment -g FZF_DEFAULT_OPTS "--color=light,bg:#f9f5d7,bg+:#d5c4a1,fg:#3c3836,fg+:#3c3836,hl:#b57614,hl+:#af3a03,info:#076678,prompt:#af3a03,pointer:#9d0006,marker:#427b58,spinner:#076678,header:#928374,border:#d5c4a1 --bind=ctrl-a:select-all"
set-environment -g LG_CONFIG_FILE "$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/themes/gruvbox-light-hard.yml"
set-environment -g DELTA_FEATURES "gruvbox-light-hard"

set -g @theme-status-bg "#f9f5d7"
set -g @theme-status-fg "#3c3836"
set -g @theme-window-bg "#fbf1c7"
set -g @theme-window-fg "#7c6f64"
set -g @theme-window-activity-bg "#fbf1c7"
set -g @theme-window-activity-fg "#7c6f64"
set -g @theme-window-current-bg "#665c54"
set -g @theme-window-current-fg "#f9f5d7"
set -g @theme-window-bell-bg "#9d0006"
set -g @theme-window-bell-fg "#f9f5d7"
set -g @theme-pane-active-border "#fbf1c7"
set -g @theme-pane-border "#fbf1c7"
set -g @theme-popup-border "#d5c4a1"
set -g @theme-message-bg "#d5c4a1"
set -g @theme-message-fg "#3c3836"
set -g @theme-display-panes-active "#504945"
set -g @theme-display-panes "#ebdbb2"
set -g @theme-clock "#076678"
set -g @theme-session-bg "#af3a03"
set -g @theme-session-fg "#f9f5d7"
set -g @theme-status-right-bg "#7c6f64"
set -g @theme-status-right-fg "#f9f5d7"
set -g @theme-window-format-bg "#f9f5d7"
set -g @theme-window-format-fg "#7c6f64"
set -g @theme-window-current-format-bg "#665c54"
set -g @theme-window-current-format-fg "#f9f5d7"
