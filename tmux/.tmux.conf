# for other use cases
# bind-key C-m run-shell "~/.config/tmux/session-menu"

bind-key C-g \
    display-popup \
    -h 60% -w 100% \
    -y 50% \
    -E \
    "sh $HOME/projects/dotfiles/tmux/tmux-switch-session.sh"

bind-key W \
    display-popup \
    -h 60% -w 100% \
    -y 50% \
    -E \
    "$HOME/projects/dotfiles/tmux/tmux-switch-window.sh"

# Using C-l seems to interfere with <prefix> l
bind-key C-s "switch-client -l"

bind R run-shell "cmds"

bind F display-popup \
    -h 80% -w 80% \
    -E \
    'quickcmds'

