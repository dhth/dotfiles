name: main

on:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      formatting: ${{ steps.filter.outputs.formatting }}
      workflows: ${{ steps.filter.outputs.workflows }}
      yml: ${{ steps.filter.outputs.yml }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            formatting:
              - "**/*.sh"
              - "utils/exe/**"
              - "karabiner/karabiner.edn"
              - "nvim/**"
              - "mise.toml"
              - "mise.lock"
              - ".miserc.toml"
              - ".github/workflows/main.yml"
            workflows:
              - ".github/**/*.yml"
              - "mise.toml"
              - "mise.lock"
              - ".miserc.toml"
            yml:
              - "**.yml"
              - "**.yaml"
              - "mise.toml"
              - "mise.lock"
              - ".miserc.toml"

  fmt:
    needs: changes
    if: ${{ needs.changes.outputs.formatting == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: shfmt cljfmt
      - name: Install StyLua
        run: mise -C nvim install --locked stylua
      - name: Check shell formatting
        run: mise run fmt:check:sh
      - name: Check EDN formatting
        run: mise run fmt:check:edn
      - name: Check Lua formatting
        run: mise run //nvim:fmt:check

  lint-workflows:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: actionlint
      - name: Lint workflows
        run: mise run lint:actions

  lint-yaml:
    needs: changes
    if: ${{ needs.changes.outputs.yml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: yamlfmt
      - name: Lint YAML
        run: mise run lint:yaml
